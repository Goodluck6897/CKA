kind: Pod
apiVersion: v1
metadata:
  name: my-csi-app
spec:
  containers:
    - name: my-frontend
      image: busybox:1.28
      volumeMounts:
      - mountPath: "/data"            # The path inside the container
        name: my-csi-inline-vol       # Must match the volume name below
      command: [ "sleep", "1000000" ]
  volumes:
    - name: my-csi-inline-vol
      emptyDir: {}                    # This initializes an empty temporary directory
